<!-- Cancel Reservation Modal -->
<div id="cancelReservationModal" class="modal-overlay" style="display:none" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="modal-box modal-box-sm">
    <div class="modal-header">
      <h2 class="modal-title txt" data-ja="予約をキャンセルしますか？" data-en="Cancel your reservation?">予約をキャンセルしますか？</h2>
      <button type="button" class="modal-close" onclick="closeCancelModal()" aria-label="Close">✕</button>
    </div>
    <p class="cancel-modal-copy txt" data-ja="キャンセルすると利用規約に記載のキャンセル料金が発生する場合があります。" data-en="Canceling may incur fees under our Terms of Service.">キャンセルすると利用規約に記載のキャンセル料金が発生する場合があります。</p>
    <p class="cancel-modal-detail"><span class="txt" data-ja="予約日時：" data-en="Reservation:">予約日時：</span><strong id="cancelReservationInfo"></strong></p>

    <form id="cancelReservationForm" method="post" action="">
      {% csrf_token %}
      <div class="d-flex gap-3" style="flex-wrap:wrap">
        <button type="submit" class="btn-submit" style="width:auto;padding:.7rem 1.5rem;background:var(--aka)">
          <span class="txt" data-ja="はい、キャンセルする" data-en="Yes, cancel reservation">はい、キャンセルする</span>
        </button>
        <button type="button" class="dash-cancel-btn" onclick="closeCancelModal()">
          <span class="txt" data-ja="戻る" data-en="Keep reservation">戻る</span>
        </button>
      </div>
      <p style="font-size:.75rem;color:var(--smoke);margin-top:1rem">
        <span class="txt" data-ja="キャンセルポリシーは" data-en="Cancellation policy is in">キャンセルポリシーは</span>
        <a href="{% url 'restaurant:terms' %}" style="color:var(--aka);text-decoration:none">
          <span class="txt" data-ja="利用規約に記載されています。" data-en="the Terms of Service.">利用規約に記載されています。</span>
        </a>
      </p>
    </form>
  </div>
</div>

<script>
(function() {
  const cancelModal = document.getElementById('cancelReservationModal');
  const cancelForm = document.getElementById('cancelReservationForm');
  const cancelInfo = document.getElementById('cancelReservationInfo');

  if (!cancelModal || !cancelForm || !cancelInfo) return;

  // Open modal when cancel button clicked
  document.querySelectorAll('.res-cancel-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const action = this.dataset.action;
      const date = this.dataset.resDate;
      const time = this.dataset.resTime;
      
      if (action) {
        cancelForm.action = action;
        cancelInfo.textContent = `${date} ${time}`;
        openModal('cancelReservationModal');
      }
    });
  });

  // Close modal function
  window.closeCancelModal = function() {
    closeModal('cancelReservationModal');
  };

  // Close on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && cancelModal.classList.contains('modal-open')) {
      closeCancelModal();
    }
  });
})();
</script>
