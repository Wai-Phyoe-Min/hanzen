{% extends "restaurant/base.html" %}
{% block title %}パスワード変更 / Change Password — 花膳{% endblock %}
{% block content %}
<div class="dash-layout">
  {% include "restaurant/dashboard/_sidebar.html" %}
  <div class="dash-main">
    <div class="dash-header">
      <h1 class="dash-title txt" data-ja="パスワード変更" data-en="Change Password">パスワード変更</h1>
    </div>
    <div class="dash-section">
      <div style="max-width:480px">
        <form id="pwForm" onsubmit="submitPwForm(event)">
          {% csrf_token %}

          <!-- Old password -->
          <div class="mb-4">
            <label class="form-label">
              <span class="txt" data-ja="現在のパスワード" data-en="Current Password">現在のパスワード</span>
            </label>
            <div class="pw-input-wrap">
              <input type="password" name="old_password" id="old_password" class="form-control" required/>
              <button type="button" class="pw-toggle" onclick="togglePw('old_password',this)">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="field-error" id="err_old_password"></div>
          </div>

          <!-- New password -->
          <div class="mb-3">
            <label class="form-label">
              <span class="txt" data-ja="新しいパスワード" data-en="New Password">新しいパスワード</span>
            </label>
            <div class="pw-input-wrap">
              <input type="password" name="new_password1" id="new_password1" class="form-control"
                     required oninput="checkStrength(this.value,'pwStrength','pwStrengthBar','pwStrengthLabel')"/>
              <button type="button" class="pw-toggle" onclick="togglePw('new_password1',this)">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <!-- Strength meter -->
            <div class="pw-strength-wrap" id="pwStrength" style="display:none">
              <div class="pw-strength-bar-track">
                <div class="pw-strength-bar" id="pwStrengthBar"></div>
              </div>
              <span class="pw-strength-label" id="pwStrengthLabel"></span>
            </div>
            <div class="field-error" id="err_new_password1"></div>
          </div>

          <!-- Confirm password -->
          <div class="mb-4">
            <label class="form-label">
              <span class="txt" data-ja="新しいパスワード（確認）" data-en="Confirm New Password">新しいパスワード（確認）</span>
            </label>
            <div class="pw-input-wrap">
              <input type="password" name="new_password2" id="new_password2" class="form-control"
                     required oninput="checkMatch()"/>
              <button type="button" class="pw-toggle" onclick="togglePw('new_password2',this)">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="pw-match-msg" id="pwMatchMsg"></div>
            <div class="field-error" id="err_new_password2"></div>
          </div>

          <div class="d-flex gap-3">
            <button type="submit" class="btn-submit" style="width:auto;padding:.85rem 2rem" id="pwSubmitBtn">
              <span class="txt" data-ja="パスワードを変更する" data-en="Change Password">パスワードを変更する</span>
            </button>
            <a href="{% url 'restaurant:dashboard_profile' %}" class="dash-cancel-btn">
              <span class="txt" data-ja="キャンセル" data-en="Cancel">キャンセル</span>
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function checkMatch() {
  const p1  = document.getElementById('new_password1').value;
  const p2  = document.getElementById('new_password2').value;
  const msg = document.getElementById('pwMatchMsg');
  if (!p2) { msg.textContent = ''; return; }
  if (p1 === p2) {
    msg.textContent = '✓ 一致しています / Passwords match';
    msg.className   = 'pw-match-msg pw-match-ok';
  } else {
    msg.textContent = '✗ 一致していません / Passwords do not match';
    msg.className   = 'pw-match-msg pw-match-err';
  }
}

async function submitPwForm(e) {
  e.preventDefault();
  // Clear errors
  document.querySelectorAll('.field-error').forEach(el => el.textContent = '');

  // Check match
  const p1 = document.getElementById('new_password1').value;
  const p2 = document.getElementById('new_password2').value;
  if (p1 !== p2) {
    document.getElementById('err_new_password2').textContent = 'パスワードが一致しません / Passwords do not match';
    return;
  }

  const btn = document.getElementById('pwSubmitBtn');
  btn.disabled = true;

  try {
    const fd  = new FormData(e.target);
    const res = await fetch('{% url "restaurant:change_password" %}', {
      method: 'POST',
      headers: { 'X-CSRFToken': window.CSRF_TOKEN, 'X-Requested-With': 'XMLHttpRequest' },
      body: fd,
    });
    const data = await res.json();
    if (data.ok) {
      showToast('パスワードを変更しました', 'Password changed successfully');
      setTimeout(() => window.location.href = '{% url "restaurant:dashboard_profile" %}', 1200);
    } else {
      Object.entries(data.errors || {}).forEach(([field, msgs]) => {
        const el = document.getElementById('err_' + field);
        if (el) el.textContent = msgs[0];
      });
    }
  } catch(err) {
    showToast('エラー / Error', 'Something went wrong');
  } finally {
    btn.disabled = false;
  }
}
</script>
{% endblock %}
